name: Build Windows App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PHP Desktop
        shell: pwsh
        run: |
          $url = "https://github.com/cztomczak/phpdesktop/releases/download/chrome-v130.1/phpdesktop-chrome-130.1-php-8.3.zip"
          Invoke-WebRequest -Uri $url -OutFile phpdesktop.zip
          Expand-Archive -Path phpdesktop.zip -DestinationPath phpdesktop -Force
          $dir = (Get-ChildItem phpdesktop -Directory | Select-Object -First 1).FullName
          "PHPDESKTOP_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble app
        shell: pwsh
        run: |
          $root = $env:PHPDESKTOP_DIR
          Remove-Item -Recurse -Force "$root\www"
          Copy-Item -Recurse "www" "$root\www"
          Copy-Item -Force "settings.json" "$root\settings.json"
          Rename-Item "$root\phpdesktop-chrome.exe" "TimetableSystem.exe"
          New-Item -ItemType Directory -Force -Path "$root\www\tmp" | Out-Null

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $root = $env:PHPDESKTOP_DIR
          Compress-Archive -Path "$root\*" -DestinationPath "TimetableSystem-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.0.0' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimetableSystem-Windows
          path: |
            TimetableSystem-Setup.exe
            TimetableSystem-Portable.zip

      # فایلەکان ناچنە ناو ڕیپۆ (ڕیپۆ گەورە دەکەن)؛ لە جیاتی ئەوە:
      # - هەر push ـێک: لە بەشی Actions وەک artifact دادەگیرێن
      # - هەر tag ـێکی v* (بۆ نموونە v2.0.0): وەک GitHub Release بڵاو دەکرێنەوە
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TimetableSystem-Setup.exe
            TimetableSystem-Portable.zip
